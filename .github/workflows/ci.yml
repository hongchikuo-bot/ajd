name: AJD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: |
          ruff check app/
          ruff format --check app/

      - name: Syntax check Python files
        run: |
          python3 -m py_compile app/app.py
          python3 -m py_compile app/harvest.py
          python3 -m py_compile app/test_adapters.py
          python3 -m py_compile app/adapters/registry.py
          for file in app/adapters/schedulers/*.py; do python3 -m py_compile "$file"; done
          for file in app/adapters/services/*.py; do python3 -m py_compile "$file"; done

      - name: Syntax check shell scripts
        run: |
          bash -n install.sh

      - name: Run adapter tests
        run: |
          cd app && python3 test_adapters.py

      - name: Build Docker image
        run: |
          docker build -t ajd-test .

      - name: Test Docker health check
        run: |
          docker run -d --name ajd-test-container -p 5080:5080 ajd-test
          sleep 10
          curl -f http://127.0.0.1:5080/ || (docker logs ajd-test-container && exit 1)
          docker stop ajd-test-container
          docker rm ajd-test-container

      - name: Check for private data leakage
        run: |
          PRIVATE_PATTERNS=(
            "YOUR_IDENTIFIER"  # Replace with your own identifier pattern if needed
          )
          for pattern in "${PRIVATE_PATTERNS[@]}"; do
            if grep -rIl "${pattern}" app/ --exclude-dir=__pycache__; then
              echo "Found private data pattern: $pattern"
              exit 1
            fi
          done
          echo "✅ No private data found"
