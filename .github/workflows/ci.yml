name: CI

on:
  push:
    branches: [main, release/v0.5.0]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then
            pip install -r app/requirements.txt
          else
            echo "No requirements.txt found, skipping dependency installation"
          fi
      
      - name: Lint install.sh
        run: bash -n install.sh || exit 1
      
      - name: Lint manual_setup.sh
        run: bash -n scripts/manual_setup.sh || exit 1
      
      - name: Lint test scripts
        run: |
          for f in scripts/*.sh; do
            if [ "$f" != "scripts/check_release_ready.sh" ]; then
              bash -n "$f" || exit 1
            fi
          done
      
      - name: Check syntax of Python files
        run: |
          python3 -m py_compile app/app.py || exit 1
          for f in $(find . -name "*.py"); do
            if [ "$f" != "app/app.py" ]; then
              python3 -m py_compile "$f" || exit 1
            fi
          done
      
      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          for f in install.sh projects.schema AGENTS.md SETUP.md Dockerfile docker-compose.yml LICENSE README.md README-zh.md; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing file: $f"
              exit 1
            fi
            echo "✅ Found: $f"
          done
